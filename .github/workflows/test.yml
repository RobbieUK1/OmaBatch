name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
  arch-gtk:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git python python-gobject gtk4 xorg-server-xvfb xorg-xauth sudo alacritty curl
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
      - run: xvfb-run -a env GDK_BACKEND=x11 GDK_SCALE=1 GDK_DPI_SCALE=1 GSK_RENDERER=cairo python tests/gui_smoke.py
      - run: |
          useradd -m tester
          chmod -R a+rX .
          su tester -c "OMABATCH_PREFIX=/tmp/omabatch-test bash '$PWD/install.sh' --local '$PWD'"
          /tmp/omabatch-test/bin/omabatch --version
